[package]
name = "cad-wizard"
version = "0.0.0"
description = "CAD Wizard desktop shell"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cad_wizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
